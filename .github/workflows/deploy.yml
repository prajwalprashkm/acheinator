name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Check the browser engine still matches the Python engine
        run: npm test

      - uses: actions/configure-pages@v5

      # Served from the root of https://acheinator.xyz (custom domain set in Settings > Pages).
      # Without the custom domain this would be "/acheinator" (prajwalprashkm.github.io/acheinator).
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""

      - uses: actions/upload-pages-artifact@v4
        with:
          path: app/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
